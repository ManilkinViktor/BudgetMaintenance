{% extends 'base.html' %}

{% block content %}
<h2>Мои категории</h2>
<a href="{% url 'category_create' %}" class="btn btn-primary">Добавить категорию</a>

<table class="table">
    <thead>
        <tr>
            <th>Название</th>
            <th>Тип</th>
            <th>По умолчанию</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.title }}</td>
            <td>{{ category.type }}</td>
            <td>{{ category.is_default}}</td>
            <td>
                <a href="{% url 'category_update' category.pk %}" class="btn btn-sm btn-outline-secondary">Изменить</a>
                <a href="{% url 'category_delete' category.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
